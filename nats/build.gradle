plugins {
    id 'io.micronaut.build.internal.nats-module'
}

dependencies {
    api mn.micronaut.messaging
    api libs.jnats

    constraints {
        // jnats 2.26.0 brings in the vulnerable bcprov-lts8on 2.73.10 (GHSA-mx76-r943-rf8g).
        api libs.bouncycastle.bcprov.lts8on
    }

    implementation mnSerde.micronaut.serde.jackson
    implementation mnReactor.micronaut.reactor

    testImplementation(platform(mnTest.boms.testcontainers))
    testImplementation(libs.testcontainers)

    compileOnly mn.micronaut.management
    compileOnly mnMicrometer.micronaut.micrometer.core

    testImplementation mn.micronaut.management
    testImplementation libs.micronaut.rxjava3
    testImplementation mnTest.micronaut.test.spock
}

test {
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
